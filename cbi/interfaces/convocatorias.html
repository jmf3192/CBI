<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Espacio de trabajo | CONASOC</title>
    <style>
      :root {
        color-scheme: light;
        --brand: #001426;
        --ink: #142033;
        --muted: #687483;
        --soft: #fbfcfd;
        --panel: #ffffff;
        --line: #e5eaf0;
        --line-strong: #d8e0e8;
        --shadow: 0 18px 52px rgba(0, 20, 38, 0.05);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        font-family:
          "Avenir Next", Avenir, "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: var(--soft);
        color: var(--ink);
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--soft);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .topbar {
        height: 82px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
        padding: 0 42px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(14px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        min-width: 0;
      }

      .brand img {
        width: 146px;
        height: auto;
        display: block;
      }

      .brand-text {
        margin: 0;
        padding-left: 18px;
        border-left: 1px solid var(--line-strong);
        color: var(--brand);
        font-size: 9px;
        font-weight: 700;
        line-height: 1.5;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .session {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .admin-link,
      .logout {
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }

      .admin-link[hidden] {
        display: none;
      }

      .admin-link:hover,
      .logout:hover {
        color: var(--brand);
      }

      main {
        width: min(100%, 980px);
        margin: 0 auto;
        padding: 76px 36px 72px;
      }

      .heading {
        margin-bottom: 28px;
      }

      .workspace-empty {
        margin: -18px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .workspace-empty[hidden],
      .workspace-section[hidden] {
        display: none;
      }

      h1 {
        margin: 0;
        color: var(--brand);
        font-size: clamp(30px, 4vw, 44px);
        line-height: 1.05;
        letter-spacing: 0;
        font-weight: 500;
      }

      .workspace-section + .workspace-section {
        margin-top: 48px;
      }

      .section-heading {
        min-height: 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 16px;
      }

      .section-heading h2 {
        margin: 0;
        color: var(--brand);
        font-size: 21px;
        font-weight: 600;
      }

      .calls {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .call {
        min-height: 270px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 24px;
        padding: 30px 26px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease,
          transform 160ms ease;
      }

      .call:focus-visible {
        outline: 4px solid rgba(137, 184, 232, 0.28);
        outline-offset: 3px;
      }

      .call:hover {
        border-color: #c9d5e0;
        box-shadow: 0 24px 64px rgba(0, 20, 38, 0.08);
        transform: translateY(-2px);
      }

      .call.is-muted {
        color: inherit;
        cursor: default;
        box-shadow: none;
      }

      .call.is-muted:hover {
        border-color: var(--line);
        box-shadow: none;
        transform: none;
      }

      .call-top {
        display: grid;
        gap: 12px;
      }

      .call h2 {
        margin: 0;
        color: var(--brand);
        font-size: 22px;
        line-height: 1.24;
        letter-spacing: 0;
        font-weight: 500;
      }

      .strategy-meta {
        color: var(--muted);
        font-size: 12px;
      }

      .call p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .call-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .call-cta,
      .call-status {
        min-height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        padding: 0 14px;
        font-size: 13px;
        font-weight: 600;
      }

      .call-cta {
        color: #ffffff;
        background: var(--brand);
      }

      .call-status {
        color: var(--muted);
        background: #f3f6f8;
      }

      @media (max-width: 920px) {
        .calls {
          grid-template-columns: 1fr;
        }

        .call {
          min-height: 0;
        }
      }

      @media (max-width: 680px) {
        .topbar {
          height: auto;
          align-items: flex-start;
          padding: 24px;
        }

        .brand {
          align-items: flex-start;
          flex-direction: column;
          gap: 12px;
        }

        .brand-text {
          padding-left: 0;
          border-left: 0;
        }

        main {
          padding: 42px 20px 54px;
        }

        .heading {
          margin-bottom: 24px;
        }

        .section-heading {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./convocatorias.html" aria-label="CONASOC">
        <img src="../assets/conasoc-logo.png" alt="CONASOC" />
        <p class="brand-text">
          Consultoría en financiación pública<br />
          Business intelligence
        </p>
      </a>

      <div class="session" aria-label="Sesión">
        <a class="admin-link" id="admin-link" href="./admin.html" hidden>Panel de control</a>
        <a class="logout" id="logout" href="./acceso.html">Salir</a>
      </div>
    </header>

    <main>
      <section class="heading" aria-labelledby="page-title">
        <h1 id="page-title">Espacio de trabajo</h1>
      </section>

      <p class="workspace-empty" id="workspace-empty" hidden>No tienes contenidos activos asignados.</p>

      <section class="workspace-section" id="calls-section" aria-labelledby="calls-title" hidden>
        <div class="section-heading">
          <h2 id="calls-title">Convocatorias activas</h2>
        </div>
        <section class="calls" id="calls" aria-label="Listado de convocatorias"></section>
      </section>

      <section class="workspace-section" id="strategies-section" aria-labelledby="strategies-title" hidden>
        <div class="section-heading">
          <h2 id="strategies-title">Estrategias de financiación</h2>
        </div>
        <section class="calls" id="strategies" aria-label="Listado de estrategias"></section>
      </section>

      <section class="workspace-section" id="trackings-section" aria-labelledby="trackings-title" hidden>
        <div class="section-heading">
          <h2 id="trackings-title">Seguimientos</h2>
        </div>
        <section class="calls" id="trackings" aria-label="Listado de seguimientos"></section>
      </section>

      <section class="workspace-section" id="sprints-section" aria-labelledby="sprints-title" hidden>
        <div class="section-heading">
          <h2 id="sprints-title">Sprints</h2>
        </div>
        <section class="calls" id="sprints" aria-label="Listado de sprints"></section>
      </section>
    </main>

    <script type="module">
      import { CBI } from "../assets/cbi-supabase.js";

      const callsContainer = document.querySelector("#calls");
      const strategiesContainer = document.querySelector("#strategies");
      const trackingsContainer = document.querySelector("#trackings");
      const sprintsContainer = document.querySelector("#sprints");
      const callsSection = document.querySelector("#calls-section");
      const strategiesSection = document.querySelector("#strategies-section");
      const trackingsSection = document.querySelector("#trackings-section");
      const sprintsSection = document.querySelector("#sprints-section");
      const workspaceEmpty = document.querySelector("#workspace-empty");
      const adminLink = document.querySelector("#admin-link");
      const logout = document.querySelector("#logout");
      const retiredTestCalls = new Set(["CONV-2026-001", "CONV-2026-002", "CONV-2026-003"]);
      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function callHref(call) {
        const legacyRoutes = {
          "CONV-2026-INNOVAE-FRIO": "./innovae-frio-dashboard.html",
          "CONV-2026-INCENTIVOS-REGIONALES": "./incentivos-regionales-dashboard.html",
        };
        const route = call.route_path || legacyRoutes[call.code] || "";
        if (!route) return "";
        const separator = route.includes("?") ? "&" : "?";
        return `${route}${separator}call=${encodeURIComponent(call.id)}`;
      }

      function strategyHref(call, options = {}) {
        if (!call) return "";
        const route = call.route_path || "./estrategia-financiacion-demo.html";
        const params = new URLSearchParams({ call: call.id, view: "data" });
        if (options.studyId) params.set("study", options.studyId);
        if (options.isNew) params.set("new", "1");
        return `${route}?${params.toString()}`;
      }

      function createCallCard(call) {
        const href = callHref(call);
        const element = document.createElement(href ? "a" : "article");
        element.className = href ? "call" : "call is-muted";
        if (href) {
          element.href = href;
          element.setAttribute("aria-label", `Abrir ${call.name}`);
        }

        element.innerHTML = `
          <div class="call-top">
            <h2>${escapeHtml(call.name)}</h2>
            <p>${escapeHtml(call.description || `Código oficial: ${call.code}`)}</p>
          </div>
          <div class="call-actions">
            <span class="${href ? "call-cta" : "call-status"}">${href ? ({ tracking: "Abrir seguimiento", sprint: "Abrir sprint" }[call.kind] || "Abrir dashboard") : "Próximamente"}</span>
          </div>
        `;

        return element;
      }

      function renderCallSection(section, container, items) {
        section.hidden = items.length === 0;
        container.innerHTML = "";
        items.forEach((call) => container.appendChild(createCallCard(call)));
      }

      function createStrategyCard(study, call) {
        const href = strategyHref(call, study ? { studyId: study.id } : { isNew: true });
        const element = document.createElement("a");
        element.className = "call";
        element.href = href;
        element.setAttribute("aria-label", `Abrir ${study?.project_name || call.name}`);
        const updatedAt = study
          ? new Date(study.updated_at).toLocaleDateString("es-ES", {
              day: "2-digit",
              month: "short",
              year: "numeric",
            })
          : null;
        element.innerHTML = `
          <div class="call-top">
            <h2>${escapeHtml(study?.project_name || call.name)}</h2>
            <p>${escapeHtml(study?.client_name || call.description || "Plantilla de estudio preparada.")}</p>
            ${updatedAt ? `<span class="strategy-meta">Actualizada ${escapeHtml(updatedAt)}</span>` : ""}
          </div>
          <div class="call-actions">
            <span class="call-cta">Abrir estrategia</span>
          </div>
        `;
        return element;
      }

      async function loadPage() {
        try {
          const auth = await CBI.requireSession();
          if (!auth) return;

          adminLink.hidden = auth.profile.role !== "admin";

          const availableCalls = (await CBI.listCalls(auth.session))
            .filter((call) => !retiredTestCalls.has(call.code));
          const strategyCalls = availableCalls.filter((call) => call.kind === "strategy");
          const normalCalls = availableCalls.filter((call) => !call.kind || call.kind === "normal");
          const trackingCalls = availableCalls.filter((call) => call.kind === "tracking");
          const sprintCalls = availableCalls.filter((call) => call.kind === "sprint");
          workspaceEmpty.hidden = availableCalls.length > 0;
          renderCallSection(callsSection, callsContainer, normalCalls);
          renderCallSection(trackingsSection, trackingsContainer, trackingCalls);
          renderCallSection(sprintsSection, sprintsContainer, sprintCalls);
          strategiesSection.hidden = strategyCalls.length === 0;
          strategiesContainer.innerHTML = "";

          const strategyGroups = await Promise.all(strategyCalls.map(async (call) => ({
            call,
            studies: await CBI.listStrategyStudies(auth.session, call.id),
          })));
          strategyGroups
            .flatMap(({ call, studies }) => studies.length
              ? studies.map((study) => ({ call, study }))
              : [{ call, study: null }])
            .sort((a, b) => new Date(b.study?.updated_at || 0) - new Date(a.study?.updated_at || 0))
            .forEach(({ call, study }) => {
              strategiesContainer.appendChild(createStrategyCard(study, call));
            });

        } catch (error) {
          callsSection.hidden = true;
          strategiesSection.hidden = true;
          trackingsSection.hidden = true;
          sprintsSection.hidden = true;
          workspaceEmpty.hidden = false;
          workspaceEmpty.textContent = error instanceof Error ? error.message : "No se ha podido cargar el espacio de trabajo.";
        }
      }

      logout.addEventListener("click", async (event) => {
        event.preventDefault();
        await CBI.signOut();
        window.location.href = "./acceso.html";
      });

      loadPage();
    </script>
  </body>
</html>
