<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Convocatorias | CONASOC</title>
    <style>
      :root {
        color-scheme: light;
        --brand: #001426;
        --ink: #142033;
        --muted: #687483;
        --soft: #fbfcfd;
        --panel: #ffffff;
        --line: #e5eaf0;
        --line-strong: #d8e0e8;
        --shadow: 0 18px 52px rgba(0, 20, 38, 0.05);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        font-family:
          "Avenir Next", Avenir, "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: var(--soft);
        color: var(--ink);
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--soft);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .topbar {
        height: 82px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
        padding: 0 42px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(14px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        min-width: 0;
      }

      .brand img {
        width: 146px;
        height: auto;
        display: block;
      }

      .brand-text {
        margin: 0;
        padding-left: 18px;
        border-left: 1px solid var(--line-strong);
        color: var(--brand);
        font-size: 9px;
        font-weight: 700;
        line-height: 1.5;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .session {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .admin-link,
      .logout {
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }

      .admin-link[hidden] {
        display: none;
      }

      .admin-link:hover,
      .logout:hover {
        color: var(--brand);
      }

      main {
        width: min(100%, 980px);
        margin: 0 auto;
        padding: 76px 36px 72px;
      }

      .heading {
        margin-bottom: 28px;
      }

      h1 {
        margin: 0;
        color: var(--brand);
        font-size: clamp(30px, 4vw, 44px);
        line-height: 1.05;
        letter-spacing: 0;
        font-weight: 500;
      }

      .calls {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .call {
        min-height: 270px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 24px;
        padding: 30px 26px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease,
          transform 160ms ease;
      }

      .call:focus-visible {
        outline: 4px solid rgba(137, 184, 232, 0.28);
        outline-offset: 3px;
      }

      .call:hover {
        border-color: #c9d5e0;
        box-shadow: 0 24px 64px rgba(0, 20, 38, 0.08);
        transform: translateY(-2px);
      }

      .call.is-muted {
        color: inherit;
        cursor: default;
        box-shadow: none;
      }

      .call.is-muted:hover {
        border-color: var(--line);
        box-shadow: none;
        transform: none;
      }

      .call-top {
        display: grid;
        gap: 12px;
      }

      .call h2 {
        margin: 0;
        color: var(--brand);
        font-size: 22px;
        line-height: 1.24;
        letter-spacing: 0;
        font-weight: 500;
      }

      .call p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .call-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .call-cta,
      .call-status {
        min-height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        padding: 0 14px;
        font-size: 13px;
        font-weight: 600;
      }

      .call-cta {
        color: #ffffff;
        background: var(--brand);
      }

      .call-status {
        color: var(--muted);
        background: #f3f6f8;
      }

      .empty-state {
        grid-column: 1 / -1;
        padding: 28px 0;
        color: var(--muted);
        font-size: 14px;
      }

      @media (max-width: 920px) {
        .calls {
          grid-template-columns: 1fr;
        }

        .call {
          min-height: 0;
        }
      }

      @media (max-width: 680px) {
        .topbar {
          height: auto;
          align-items: flex-start;
          padding: 24px;
        }

        .brand {
          align-items: flex-start;
          flex-direction: column;
          gap: 12px;
        }

        .brand-text {
          padding-left: 0;
          border-left: 0;
        }

        main {
          padding: 42px 20px 54px;
        }

        .heading {
          margin-bottom: 24px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./convocatorias.html" aria-label="CONASOC">
        <img src="../assets/conasoc-logo.png" alt="CONASOC" />
        <p class="brand-text">
          Consultoría en financiación pública<br />
          Business intelligence
        </p>
      </a>

      <div class="session" aria-label="Sesión">
        <a class="admin-link" id="admin-link" href="./admin.html" hidden>Panel de control</a>
        <a class="logout" id="logout" href="./acceso.html">Salir</a>
      </div>
    </header>

    <main>
      <section class="heading" aria-labelledby="page-title">
        <h1 id="page-title">Convocatorias activas</h1>
      </section>

      <section class="calls" id="calls" aria-label="Listado de convocatorias">
        <p class="empty-state">Cargando convocatorias.</p>
      </section>
    </main>

    <script type="module">
      import { CBI } from "../assets/cbi-supabase.js";

      const callsContainer = document.querySelector("#calls");
      const adminLink = document.querySelector("#admin-link");
      const logout = document.querySelector("#logout");

      function callHref(call) {
        if (call.code === "CONV-2026-INNOVAE-FRIO") return "./innovae-frio-dashboard.html";
        return "";
      }

      function createCallCard(call) {
        const href = callHref(call);
        const element = document.createElement(href ? "a" : "article");
        element.className = href ? "call" : "call is-muted";
        if (href) {
          element.href = href;
          element.setAttribute("aria-label", `Abrir ${call.name}`);
        }

        element.innerHTML = `
          <div class="call-top">
            <h2>${call.name}</h2>
            <p>Código oficial: ${call.code}</p>
          </div>
          <div class="call-actions">
            <span class="${href ? "call-cta" : "call-status"}">${href ? "Abrir dashboard" : "Pendiente"}</span>
          </div>
        `;

        return element;
      }

      async function loadPage() {
        try {
          const auth = await CBI.requireSession();
          if (!auth) return;

          adminLink.hidden = auth.profile.role !== "admin";

          const calls = await CBI.listCalls(auth.session);
          callsContainer.innerHTML = "";

          if (!calls.length) {
            callsContainer.innerHTML = '<p class="empty-state">No hay convocatorias activas disponibles.</p>';
            return;
          }

          calls.forEach((call) => callsContainer.appendChild(createCallCard(call)));
        } catch (error) {
          callsContainer.innerHTML = `<p class="empty-state">${error instanceof Error ? error.message : "No se han podido cargar las convocatorias."}</p>`;
        }
      }

      logout.addEventListener("click", async (event) => {
        event.preventDefault();
        await CBI.signOut();
        window.location.href = "./acceso.html";
      });

      loadPage();
    </script>
  </body>
</html>
